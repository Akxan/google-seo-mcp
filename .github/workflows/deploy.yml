name: CI & Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Secret scan of the tree
        run: scripts/check-secrets.sh --all
  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - name: Skip when only docs changed
        id: docs
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -vqE '(\.md$|^docs/|^\.env\.example$|^LICENSE$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare SSH
        if: steps.docs.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Trigger self-update on the server
        if: steps.docs.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
