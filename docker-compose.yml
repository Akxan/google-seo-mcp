services:
  google-seo-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/credentials.json
    volumes:
      - ./credentials.json:/secrets/credentials.json:ro
